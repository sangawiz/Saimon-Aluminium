<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hekima Maulilio Sanga — Software Engineer</title>
<meta name="description" content="Portfolio of Hekima Maulilio Sanga, software engineer and Laravel developer based in Morogoro, Tanzania.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0A0F1C;
    --night-2:#111829;
    --paper:#EFE9DC;
    --ink:#171B26;
    --green:#2F7D5B;
    --gold:#D9A441;
    --mist:#8A93A6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, #1A2337 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 50% 100%, rgba(47,125,91,0.16) 0%, transparent 70%),
      var(--night);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse 70% 70% at 50% 50%, transparent 55%, rgba(5,8,15,0.75) 100%);
  }

  #stage{ position:fixed; inset:0; z-index:1; }
  #stage canvas{ display:block; touch-action:none; cursor:grab; }
  #stage canvas:active{ cursor:grabbing; }

  /* ---------- overlay chrome ---------- */
  .mark{
    position:fixed; top:26px; left:30px; z-index:6;
    font-family:'Bricolage Grotesque', sans-serif; font-weight:700;
    font-size:15px; letter-spacing:0.2px; line-height:1.25;
  }
  .mark span{
    display:block; font-family:'Inter'; font-weight:500;
    font-size:11px; letter-spacing:1.6px; color:var(--mist); margin-top:3px;
  }

  .controls{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:18px;
    opacity:0; transition:opacity .5s ease .3s; pointer-events:none;
  }
  .controls.live{ opacity:1; pointer-events:auto; }
  .arrow{
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(239,233,220,0.22); background:rgba(239,233,220,0.04);
    color:var(--paper); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .arrow:hover:not(:disabled){ background:rgba(217,164,65,0.16); border-color:var(--gold); transform:translateY(-2px); }
  .arrow:disabled{ opacity:0.25; cursor:default; }
  .arrow svg{ width:17px; height:17px; }
  .counter{
    font-family:'Bricolage Grotesque', sans-serif; font-weight:700;
    font-size:14px; letter-spacing:1px; min-width:74px; text-align:center; color:var(--mist);
  }
  .counter b{ color:var(--paper); font-weight:700; }

  .hint{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:6;
    font-size:12px; letter-spacing:0.4px; color:var(--mist);
    opacity:0; transition:opacity .6s ease; pointer-events:none; white-space:nowrap;
  }
  .hint.live{ opacity:1; }

  /* ---------- intro ---------- */
  #intro{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    background:rgba(10,15,28,0.72); backdrop-filter:blur(6px);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #intro.gone{ opacity:0; visibility:hidden; }
  #intro h1{
    font-family:'Bricolage Grotesque', sans-serif; font-weight:800;
    font-size:clamp(34px, 7vw, 62px); line-height:1.02; letter-spacing:-0.5px;
    max-width:14ch;
  }
  #intro p{
    margin-top:18px; color:var(--mist); font-size:15px; max-width:44ch; line-height:1.6;
  }
  .open-btn{
    margin-top:34px; display:inline-flex; align-items:center; gap:11px;
    background:var(--gold); color:#14171F; border:none;
    font-family:'Inter'; font-weight:700; font-size:14px; letter-spacing:0.2px;
    padding:15px 30px; border-radius:2px; cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .open-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 34px rgba(217,164,65,0.32); }
  .open-btn svg{ width:16px; height:16px; }

  .loading{ margin-top:34px; font-size:12px; color:var(--mist); letter-spacing:1px; }

  @media (max-width:620px){
    .mark{ top:18px; left:20px; font-size:13px; }
    .controls{ bottom:22px; gap:14px; }
    .hint{ bottom:76px; font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce){
    .open-btn:hover, .arrow:hover:not(:disabled){ transform:none; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

var C = {
  paper:'#EFE9DC', ink:'#171B26', green:'#2F7D5B',
  gold:'#D9A441', mist:'#6E7688', board:'#141A28'
};

var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =========================================================
   1.  PAGE CONTENT  — short on purpose. Read in one glance.
   ========================================================= */
var PAGES = {
  cover: { kind:'cover' },

  profile: { kind:'page', num:'i', title:'Who I am',
    body:'I build full-stack web applications — Laravel and PHP on the back end, Tailwind and Alpine on the front. I care about clean structure, honest performance, and interfaces that work on a cheap phone as well as a laptop.',
    note:'Morogoro, Tanzania' },

  skills: { kind:'page', num:'01', title:'What I work with',
    groups:[
      { k:'Languages', v:'PHP · JavaScript · SQL · HTML · CSS' },

    ]},

  education: { kind:'page', num:'02', title:'Where I studied',

  project: { kind:'page', num:'03', title:'SmartMyBuy',
    body:'A price-comparison marketplace. People compare prices across retailers, track how a price has moved, save what they want, and find affiliate offers. Admins manage products, retailers, reviews and analytics from one dashboard.',

    bullets:[
      'Database schema and app architecture',

  strengths: { kind:'page', num:'05', title:'How I work',
    bullets:[

    ],
    note:'English · Swahili' },

  contact: { kind:'page', num:'06', title:'Say hello',
    contact:[
      { k:'Email', v:'sangahekima24@gmail.com' },
      { k:'Phone', v:'+255 769 129 369' },

    ]},

  end: { kind:'end' }

/* =========================================================
   2.  DRAW EACH PAGE ONTO A CANVAS  → used as a texture
   ========================================================= */
var CW = 1000, CH = 1400, M = 96;

function ctxNew(){
  var c = document.createElement('canvas');
  c.width = CW; c.height = CH;
  return c;
}

function paperBase(x){
  x.fillStyle = C.paper;
  x.fillRect(0,0,CW,CH);
  // faint fibre speckle so it reads as paper, not plastic
  x.globalAlpha = 0.045;
  for (var i=0;i<1600;i++){
    x.fillStyle = (i%3===0) ? '#9A9280' : '#C8C0AE';
    x.fillRect(Math.random()*CW, Math.random()*CH, 1.6, 1.6);
  }
  x.globalAlpha = 1;
  // gutter shading near the spine
  var g = x.createLinearGradient(0,0,190,0);
  g.addColorStop(0,'rgba(23,27,38,0.20)');
  g.addColorStop(1,'rgba(23,27,38,0)');
  x.fillStyle = g; x.fillRect(0,0,190,CH);
}

function wrap(x, text, left, top, maxW, lineH){
  var words = text.split(' '), line = '', y = top;
  for (var i=0;i<words.length;i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if (x.measureText(test).width > maxW && line){
      x.fillText(line, left, y); line = words[i]; y += lineH;
    } else { line = test; }
  }
  if (line) { x.fillText(line, left, y); y += lineH; }
  return y;
}

function drawPage(p){
  var c = ctxNew(), x = c.getContext('2d');
  paperBase(x);
  var L = M + 40, W = CW - L - M;

  // page number
  x.fillStyle = C.mist;
  x.font = '600 26px Inter, sans-serif';
  x.fillText(p.num, L, M + 24);

  // title
  x.fillStyle = C.ink;
  x.font = '700 74px "Bricolage Grotesque", sans-serif';
  var y = wrap(x, p.title, L, M + 140, W, 80);

  // rule
  y += 18;
  x.fillStyle = C.gold;
  x.fillRect(L, y, 96, 5);
  y += 78;

  if (p.big){
    x.fillStyle = C.green;
    x.font = '700 54px "Bricolage Grotesque", sans-serif';
    y = wrap(x, p.big, L, y, W, 62) + 16;
  }

  if (p.body){
    x.fillStyle = C.ink;
    x.font = '400 33px Inter, sans-serif';
    y = wrap(x, p.body, L, y, W, 52) + 34;
  }

  if (p.groups){
    for (var i=0;i<p.groups.length;i++){
      x.fillStyle = C.green;
      x.font = '700 25px Inter, sans-serif';
      x.fillText(p.groups[i].k, L, y);
      y += 40;
      x.fillStyle = C.ink;
      x.font = '400 31px Inter, sans-serif';
      y = wrap(x, p.groups[i].v, L, y, W, 46) + 38;
    }
  }

  if (p.bullets){
    x.font = '400 33px Inter, sans-serif';
    for (var b=0;b<p.bullets.length;b++){
      x.fillStyle = C.gold;
      x.beginPath(); x.arc(L + 7, y - 11, 7, 0, Math.PI*2); x.fill();
      x.fillStyle = C.ink;
      y = wrap(x, p.bullets[b], L + 40, y, W - 40, 46) + 30;
    }
  }

  if (p.contact){
    for (var k=0;k<p.contact.length;k++){
      x.fillStyle = C.mist;
      x.font = '600 23px Inter, sans-serif';
      x.fillText(p.contact[k].k, L, y);
      y += 42;
      x.fillStyle = C.ink;
      x.font = '600 36px Inter, sans-serif';
      x.fillText(p.contact[k].v, L, y);
      y += 74;
    }
  }

  if (p.note){
    x.fillStyle = C.mist;
    x.font = '500 26px Inter, sans-serif';
    x.fillText(p.note, L, CH - M - 10);
  }
  return c;
}

function drawCover(){
  var c = ctxNew(), x = c.getContext('2d');
  // dark board
  x.fillStyle = C.board; x.fillRect(0,0,CW,CH);
  var g = x.createLinearGradient(0,0,CW,CH);
  g.addColorStop(0,'rgba(47,125,91,0.30)');
  g.addColorStop(0.55,'rgba(20,26,40,0)');
  g.addColorStop(1,'rgba(217,164,65,0.18)');
  x.fillStyle = g; x.fillRect(0,0,CW,CH);
  // grain
  x.globalAlpha = 0.05;
  for (var i=0;i<1400;i++){
    x.fillStyle = '#FFFFFF';
    x.fillRect(Math.random()*CW, Math.random()*CH, 1.5, 1.5);
  }
  x.globalAlpha = 1;
  // debossed border
  x.strokeStyle = 'rgba(217,164,65,0.42)';
  x.lineWidth = 3;
  x.strokeRect(M*0.7, M*0.7, CW - M*1.4, CH - M*1.4);

  x.fillStyle = C.gold;
  x.font = '600 27px Inter, sans-serif';
  x.fillText('PORTFOLIO', M + 28, M + 120);

  x.fillStyle = '#F3EEE3';
  x.font = '800 96px "Bricolage Grotesque", sans-serif';
  var y = wrap(x, 'Hekima Maulilio Sanga', M + 28, CH/2 - 60, CW - M*2 - 56, 100);

  x.fillStyle = C.gold;
  x.fillRect(M + 28, y + 16, 120, 6);

  x.fillStyle = '#AEB6C6';
  x.font = '500 32px Inter, sans-serif';
  x.fillText('Software engineer', M + 28, y + 100);
  x.fillText('Laravel · full-stack', M + 28, y + 150);

  x.fillStyle = '#7C8496';
  x.font = '500 25px Inter, sans-serif';
  x.fillText('Morogoro, Tanzania', M + 28, CH - M - 10);
  return c;
}

function drawEnd(){
  var c = ctxNew(), x = c.getContext('2d');
  paperBase(x);
  x.fillStyle = C.ink;
  x.font = '700 62px "Bricolage Grotesque", sans-serif';
  wrap(x, 'Thanks for reading.', M + 40, CH/2 - 40, CW - M*2, 72);
  x.fillStyle = C.gold;
  x.fillRect(M + 40, CH/2 + 44, 96, 5);
  x.fillStyle = C.mist;
  x.font = '400 30px Inter, sans-serif';
  x.fillText('References available on request.', M + 40, CH/2 + 122);
  return c;
}

function drawBack(){
  var c = ctxNew(), x = c.getContext('2d');
  x.fillStyle = C.board; x.fillRect(0,0,CW,CH);
  x.globalAlpha = 0.05;
  for (var i=0;i<1200;i++){ x.fillStyle='#FFF'; x.fillRect(Math.random()*CW, Math.random()*CH, 1.5,1.5); }
  x.globalAlpha = 1;
  x.strokeStyle = 'rgba(217,164,65,0.22)'; x.lineWidth = 3;
  x.strokeRect(M*0.7, M*0.7, CW - M*1.4, CH - M*1.4);
  x.fillStyle = 'rgba(217,164,65,0.75)';
  x.font = '700 40px "Bricolage Grotesque", sans-serif';
  x.textAlign = 'center';
  x.fillText('HS', CW/2, CH/2 + 14);
  x.textAlign = 'left';
  return c;
}

/* =========================================================
   3.  THREE.JS SCENE
   ========================================================= */
var stage = document.getElementById('stage');
var intro = document.getElementById('intro');
var openBtn = document.getElementById('openBtn');
var loading = document.getElementById('loading');
var controls = document.getElementById('controls');
var hintEl = document.getElementById('hint');
var counter = document.getElementById('counter');
var prevBtn = document.getElementById('prev');
var nextBtn = document.getElementById('next');

if (!window.THREE){ loading.textContent = 'This page needs WebGL.'; return; }

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
camera.position.set(0, 1.4, 17);

var renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
} catch(e){ loading.textContent = 'This page needs WebGL.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
stage.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.62));
var key = new THREE.DirectionalLight(0xfff2dd, 1.15);
key.position.set(5, 9, 8); scene.add(key);
var fill = new THREE.DirectionalLight(0x2F7D5B, 0.5);
fill.position.set(-7, -2, 4); scene.add(fill);
var warm = new THREE.PointLight(0xD9A441, 1.0, 34);
warm.position.set(-3, 4, 7); scene.add(warm);

/* ---- dust motes, so the space feels occupied ---- */
var dustGeo = new THREE.BufferGeometry();
var dn = 260, dpos = new Float32Array(dn*3);
for (var d=0; d<dn; d++){
  dpos[d*3]   = (Math.random()-0.5)*34;
  dpos[d*3+1] = (Math.random()-0.5)*22;
  dpos[d*3+2] = (Math.random()-0.5)*18 - 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos,3));
var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color:0xD9A441, size:0.055, transparent:true, opacity:0.5, depthWrite:false
}));
scene.add(dust);

var book = new THREE.Group();
book.position.y = 0.2;
scene.add(book);

var PW = 5.2, PH = 7.3;   // page width / height

function tex(canvas){
  var t = new THREE.CanvasTexture(canvas);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 4;
  t.needsUpdate = true;
  return t;
}

/* ---- a flippable unit: pivots on the spine, holds a front + back face ---- */
function makeUnit(frontCanvas, backCanvas, thick){
  var pivot = new THREE.Group();
  pivot.position.x = -PW/2;               // hinge sits on the spine
  book.add(pivot);

  var segs = 26;
  var meshes = [];

  function face(canvas, flip){
    var geo = new THREE.PlaneGeometry(PW, PH, segs, 1);
    geo.translate(PW/2, 0, 0);            // so x runs 0 → PW from the hinge
    var mat = new THREE.MeshStandardMaterial({
      map: tex(canvas),
      roughness: thick ? 0.62 : 0.88,
      metalness: thick ? 0.18 : 0.02,
      side: THREE.FrontSide
    });
    var m = new THREE.Mesh(geo, mat);
    if (flip){ m.rotation.y = Math.PI; m.position.z = -(thick ? 0.07 : 0.008); }
    else { m.position.z = (thick ? 0.07 : 0.008); }
    // keep a pristine copy of the vertex positions for bending
    m.userData.base = geo.attributes.position.array.slice(0);
    pivot.add(m);
    meshes.push(m);
    return m;
  }

  face(frontCanvas, false);
  face(backCanvas, true);

  return { pivot:pivot, meshes:meshes, rot:0, target:0, thick:!!thick };
}

/* ---- bend the paper mid-turn: this is what sells it as paper ---- */
function bendUnit(u){
  var amt = Math.sin(u.rot) * (u.thick ? 0.10 : 0.95);
  for (var i=0;i<u.meshes.length;i++){
    var m = u.meshes[i];
    var pos = m.geometry.attributes.position;
    var base = m.userData.base;
    for (var v=0; v<pos.count; v++){
      var bx = base[v*3], by = base[v*3+1], bz = base[v*3+2];
      var t = bx / PW;                               // 0 at hinge, 1 at edge
      var curl = Math.sin(t * Math.PI) * amt;        // belly of the page
      var lift = Math.pow(t, 2.2) * amt * 0.30;      // the free edge lifts more
      pos.array[v*3]   = bx - curl * 0.16;           // slight pull toward hinge
      pos.array[v*3+1] = by * (1 - curl * 0.012);
      pos.array[v*3+2] = bz + curl + lift;
    }
    pos.needsUpdate = true;
    m.geometry.computeVertexNormals();
  }
}

/* ---- build the book ---- */
var units = [];
var canvases = {};

function buildBook(){
  canvases.cover     = drawCover();
  canvases.profile   = drawPage(PAGES.profile);
  canvases.skills    = drawPage(PAGES.skills);
  canvases.education = drawPage(PAGES.education);
  canvases.project   = drawPage(PAGES.project);
  canvases.built     = drawPage(PAGES.built);
  canvases.strengths = drawPage(PAGES.strengths);
  canvases.contact   = drawPage(PAGES.contact);
  canvases.end       = drawEnd();
  canvases.back      = drawBack();

  units.push(makeUnit(canvases.cover,     canvases.profile,   true));
  units.push(makeUnit(canvases.skills,    canvases.education, false));
  units.push(makeUnit(canvases.project,   canvases.built,     false));
  units.push(makeUnit(canvases.strengths, canvases.contact,   false));

  // fixed back board + inside-back page
  var backPivot = new THREE.Group();
  backPivot.position.x = -PW/2;
  var endGeo = new THREE.PlaneGeometry(PW, PH);
  endGeo.translate(PW/2, 0, 0);
  var endMesh = new THREE.Mesh(endGeo, new THREE.MeshStandardMaterial({ map:tex(canvases.end), roughness:0.9 }));
  endMesh.position.z = -0.10;
  var boardGeo = new THREE.PlaneGeometry(PW, PH);
  boardGeo.translate(PW/2, 0, 0);
  var boardMesh = new THREE.Mesh(boardGeo, new THREE.MeshStandardMaterial({ map:tex(canvases.back), roughness:0.6, metalness:0.2 }));
  boardMesh.rotation.y = Math.PI;
  boardMesh.position.z = -0.17;
  backPivot.add(endMesh, boardMesh);
  book.add(backPivot);

  // spine
  var spine = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, PH + 0.12, 0.40),
    new THREE.MeshStandardMaterial({ color:0x141A28, roughness:0.55, metalness:0.25 })
  );
  spine.position.set(-PW/2 - 0.02, 0, -0.06);
  book.add(spine);
}

/* =========================================================
   4.  TURNING PAGES
   ========================================================= */
var current = 0;                  // 0 = closed, 4 = fully open at the end
var MAXI = 4;
var dragUnit = null, dragging = false, dragStartX = 0, dragBase = 0, moved = false;
var opened = false;

function stackZ(){
  for (var i=0;i<units.length;i++){
    var u = units[i];
    var step = u.thick ? 0.05 : 0.022;
    var flipped = (i < current);
    var z = flipped ? step*(i+1) : -step*(i+1);
    u.pivot.position.z += (z - u.pivot.position.z) * 0.25;
  }
}

function goTo(n){
  current = Math.max(0, Math.min(MAXI, n));
  for (var i=0;i<units.length;i++){
    units[i].target = (i < current) ? Math.PI : 0;
  }
  counter.innerHTML = '<b>' + (current+1) + '</b> / ' + (MAXI+1);
  prevBtn.disabled = (current === 0);
  nextBtn.disabled = (current === MAXI);
}

function next(){ if (current < MAXI) goTo(current+1); }
function prev(){ if (current > 0) goTo(current-1); }

nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);
window.addEventListener('keydown', function(e){
  if (!opened) return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

/* ---- drag a page with the pointer ---- */
var el = renderer.domElement;

el.addEventListener('pointerdown', function(e){
  if (!opened) return;
  dragging = true; moved = false;
  dragStartX = e.clientX;
  dragUnit = null;
  el.setPointerCapture(e.pointerId);
});

el.addEventListener('pointermove', function(e){
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
  if (!dragging) return;

  var dx = e.clientX - dragStartX;
  if (Math.abs(dx) > 4) moved = true;

  if (!dragUnit){
    if (dx < -6 && current < MAXI)      dragUnit = { u:units[current], dir:1, from:0 };
    else if (dx > 6 && current > 0)     dragUnit = { u:units[current-1], dir:-1, from:Math.PI };
  }
  if (dragUnit){
    var span = Math.min(window.innerWidth * 0.55, 460);
    var p = Math.max(0, Math.min(1, Math.abs(dx) / span));
    dragUnit.u.target = dragUnit.dir === 1 ? p * Math.PI : Math.PI - p * Math.PI;
    dragUnit.u.dragging = true;
  }
});

function endDrag(){
  if (dragUnit){
    var u = dragUnit.u;
    u.dragging = false;
    var past = (dragUnit.dir === 1) ? (u.target > Math.PI*0.42) : (u.target < Math.PI*0.58);
    if (past) { goTo(dragUnit.dir === 1 ? current+1 : current-1); }
    else      { goTo(current); }
    dragUnit = null;
  } else if (dragging && !moved && opened){
    // a plain click on the right half turns forward, left half turns back
    if (dragStartX < window.innerWidth * 0.42) prev(); else next();
  }
  dragging = false;
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

/* =========================================================
   5.  OPENING SEQUENCE + LOOP
   ========================================================= */
var pointer = { x:0, y:0 };
var camTarget = { z:13.4, y:1.0 };
var bookTarget = { rx:-0.16, ry:0.30, x:0 };

function openBook(){
  if (opened) return;
  opened = true;
  intro.classList.add('gone');
  // book rotates flat-on and slides left so both pages sit in frame
  bookTarget.rx = -0.30;
  bookTarget.ry = 0.02;
  bookTarget.x  = PW/2;
  camTarget.z = 14.2;
  camTarget.y = 0.6;
  setTimeout(function(){ goTo(1); }, 420);
  setTimeout(function(){
    controls.classList.add('live');
    hintEl.classList.add('live');
  }, 1000);
  setTimeout(function(){ hintEl.classList.remove('live'); }, 6200);
}
openBtn.addEventListener('click', openBook);

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  // on a narrow screen, back off so the spread still fits
  camera.fov = w < 760 ? 52 : 38;
  camera.updateProjectionMatrix();
  bookTarget.x = opened ? (w < 760 ? PW/2 : PW/2) : 0;
}
window.addEventListener('resize', resize);

function lerp(a,b,t){ return a + (b-a)*t; }

var clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  var t = clock.getElapsedTime();

  for (var i=0;i<units.length;i++){
    var u = units[i];
    var ease = u.dragging ? 0.34 : 0.085;
    u.rot = lerp(u.rot, u.target, ease);
    u.pivot.rotation.y = -u.rot;
    bendUnit(u);
  }
  stackZ();

  // book follows the pointer a little — enough to feel held, not enough to annoy
  var wob = reduced ? 0 : Math.sin(t*0.4)*0.012;
  book.rotation.x = lerp(book.rotation.x, bookTarget.rx + (-pointer.y*0.10), 0.05);
  book.rotation.y = lerp(book.rotation.y, bookTarget.ry + (pointer.x*0.16) + wob, 0.05);
  book.position.x = lerp(book.position.x, bookTarget.x, 0.06);

  camera.position.z = lerp(camera.position.z, camTarget.z, 0.04);
  camera.position.y = lerp(camera.position.y, camTarget.y, 0.04);
  camera.lookAt(0, 0, 0);

  if (!reduced){
    dust.rotation.y = t * 0.012;
    dust.position.y = Math.sin(t*0.22) * 0.35;
  }

  renderer.render(scene, camera);
}

/* ---- wait for the fonts, or the canvas text draws in Times ---- */
function start(){
  buildBook();
  resize();
  goTo(0);
  loop();
  loading.style.display = 'none';
  openBtn.style.display = 'inline-flex';
}

if (document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('800 96px "Bricolage Grotesque"'),
    document.fonts.load('700 74px "Bricolage Grotesque"'),
    document.fonts.load('400 33px Inter'),
    document.fonts.load('600 26px Inter')
  ]).then(start).catch(start);
} else {
  setTimeout(start, 600);
}

})();
</script>
</body>
