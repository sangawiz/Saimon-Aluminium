<style>
  :root{
    --black:#0A0C12;
    --black-2:#12151F;
    --white:#FFFFFF;
    --paper:#FBFBFC;
    --ink:#0A0C12;
    --blue:#2E5EFF;
    --blue-dim:#1B3AA3;
    --mist:#5B6172;
    --hair:rgba(255,255,255,0.10);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* faint blueprint grid — quiet, not decorative-loud */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.05;
    background-image:
      repeating-linear-gradient(0deg, #fff 0, #fff 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, #fff 0, #fff 1px, transparent 1px, transparent 64px);
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse 68% 72% at 50% 48%, transparent 48%, rgba(4,5,9,0.82) 100%);
  }

  #stage{ position:fixed; inset:0; z-index:1; }
  #stage canvas{ display:block; width:100%; height:100%; touch-action:none; cursor:grab; -webkit-tap-highlight-color:transparent; }
  #stage canvas:active{ cursor:grabbing; }

  /* ---------- chrome ---------- */
  .mark{
    position:fixed; top:26px; left:30px; z-index:6;
    font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:14px; letter-spacing:0.2px;
  }
  .mark span{
    display:block; margin-top:4px; font-family:'JetBrains Mono', monospace; font-weight:500;
    font-size:9.5px; letter-spacing:1.6px; color:var(--mist);
  }
  .index{
    position:fixed; top:26px; right:30px; z-index:6;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:1px; color:var(--mist);
    display:flex; align-items:center; gap:8px;
  }
  .index i{ width:5px; height:5px; background:var(--blue); border-radius:50%; box-shadow:0 0 8px var(--blue); }

  .controls{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:16px;
    opacity:0; pointer-events:none; transition:opacity .5s ease .2s;
  }
  .controls.live{ opacity:1; pointer-events:auto; }
  .arrow{
    width:44px; height:44px; border-radius:2px;
    border:1px solid var(--hair); background:rgba(255,255,255,0.03);
    color:var(--white); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .2s, border-color .2s, transform .15s;
  }
  .arrow:hover:not(:disabled){ background:rgba(46,94,255,0.16); border-color:var(--blue); transform:translateY(-2px); }
  .arrow:active:not(:disabled){ transform:scale(.94); }
  .arrow:disabled{ opacity:0.22; cursor:default; }
  .arrow svg{ width:16px; height:16px; }
  .counter{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:1px; min-width:56px; text-align:center; color:var(--mist); }
  .counter b{ color:var(--white); font-weight:500; }

  .hint{
    position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:6;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.6px; color:var(--mist);
    opacity:0; transition:opacity .6s ease; pointer-events:none; text-transform:uppercase;
  }
  .hint.live{ opacity:1; }

  /* ---------- intro : sparse, cryptic ---------- */
  #intro{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    text-align:center; padding:32px 24px;
    min-height:100vh; min-height:100dvh;
    transition:opacity .8s ease, visibility .8s ease;
  }
  #intro.gone{ opacity:0; visibility:hidden; }
  .intro-code{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:3px; color:var(--blue);
    opacity:0.85; line-height:1.4;
  }
  #intro h1{
    font-family:'Bricolage Grotesque', sans-serif; font-weight:800;
    font-size:clamp(24px, 5.5vw, 46px); line-height:1.15; letter-spacing:-0.5px;
    max-width:16ch; color:var(--white);
  }
  #intro p{
    color:var(--mist); font-size:13px; max-width:38ch; line-height:1.6;
  }
  .open-btn{
    display:inline-flex; align-items:center; gap:12px;
    background:transparent; color:var(--white); border:1px solid var(--hair);
    font-family:'JetBrains Mono', monospace; font-weight:500; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; padding:16px 30px; border-radius:2px; cursor:pointer;
    transition:border-color .25s ease, background .25s ease, transform .2s ease;
  }
  .open-btn:hover{ border-color:var(--blue); background:rgba(46,94,255,0.10); transform:translateY(-2px); }
  .open-btn svg{ width:14px; height:14px; }
  .loading{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--mist); letter-spacing:1.4px; }

  @media (max-width:620px){
    .mark{ top:18px; left:18px; font-size:12.5px; }
    .index{ top:18px; right:18px; font-size:9px; }
    .controls{ bottom:max(20px, env(safe-area-inset-bottom)); gap:12px; }
    .hint{ bottom:max(78px, calc(78px + env(safe-area-inset-bottom))); font-size:9.5px; }
    #intro{ padding:max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  }

  @media (prefers-reduced-motion: reduce){
    .open-btn:hover, .arrow:hover:not(:disabled){ transform:none; }
  }
</style>

<script>
(function(){
'use strict';

var C = {

/* =========================================================

var PAGES = {

/* =========================================================
   2.  RENDER EACH PAGE ONTO A CANVAS (used as a texture)
   ========================================================= */
var DW = 1000, DH = 1400, M = 96, SS = 1.5;
var CW = DW, CH = DH;

function ctxNew(){
  var c = document.createElement('canvas');
  c.width = DW * SS; c.height = DH * SS;
  var x = c.getContext('2d');
  x.scale(SS, SS);
  x.textBaseline = 'alphabetic';
  return c;
}

function wrap(x, text, left, top, maxW, lineH){
  var words = text.split(' '), line = '', y = top;
  for (var i=0;i<words.length;i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if (x.measureText(test).width > maxW && line){
      x.fillText(line, left, y); line = words[i]; y += lineH;
    } else { line = test; }
  }
  if (line) { x.fillText(line, left, y); y += lineH; }
  return y;
}

function rrect(x, l, t, w, h, r){
  x.beginPath();
  x.moveTo(l+r, t);
  x.arcTo(l+w, t, l+w, t+h, r);
  x.arcTo(l+w, t+h, l, t+h, r);
  x.arcTo(l, t+h, l, t, r);
  x.arcTo(l, t, l+w, t, r);
  x.closePath();
}

function paperBase(x){
  x.fillStyle = C.white;
  x.fillRect(0,0,CW,CH);
  x.globalAlpha = 0.03;
  for (var i=0;i<1200;i++){
    x.fillStyle = (i%2===0) ? '#0A0C12' : '#3A3F4C';
    x.fillRect(Math.random()*CW, Math.random()*CH, 1.4, 1.4);
  }
  x.globalAlpha = 1;
  var g = x.createLinearGradient(0,0,170,0);
  g.addColorStop(0,'rgba(10,12,18,0.14)');
  g.addColorStop(1,'rgba(10,12,18,0)');
  x.fillStyle = g; x.fillRect(0,0,170,CH);
}

function header(x, p, L, W){
  x.fillStyle = C.mist;
  x.font = '500 20px "JetBrains Mono", monospace';
  x.fillText(p.num, L, M + 8);

  x.fillStyle = C.blue;
  x.font = '700 15px Inter, sans-serif';
  x.fillText(p.eyebrow, CW - M - x.measureText(p.eyebrow).width, M + 8);

  x.fillStyle = C.blue;
  x.fillRect(L, M + 26, 40, 3);

  x.fillStyle = C.ink;
  x.font = '800 66px "Bricolage Grotesque", sans-serif';
  var y = wrap(x, p.title, L, M + 118, W, 72);
  return y + 46;
}

function drawPage(p){
  var c = ctxNew(), x = c.getContext('2d');
  paperBase(x);
  var L = M + 40, W = CW - L - M;
  var y = header(x, p, L, W);

  if (p.body){
    x.fillStyle = C.ink;
    x.font = '500 30px Inter, sans-serif';
    y = wrap(x, p.body, L, y, W, 46) + 26;
  }

  if (p.tags){
    x.font = '600 18px Inter, sans-serif';
    var cx = L, cy = y;
    for (var i=0;i<p.tags.length;i++){
      var tw = x.measureText(p.tags[i]).width + 30;
      if (cx + tw > L + W){ cx = L; cy += 48; }
      rrect(x, cx, cy, tw, 40, 3);
      x.strokeStyle = 'rgba(46,94,255,0.5)'; x.lineWidth = 1; x.stroke();
      x.fillStyle = C.blueDeep;
      x.fillText(p.tags[i], cx + 15, cy + 26);
      cx += tw + 10;
    }
    y = cy + 60;
  }

  if (p.quote){
    x.strokeStyle = 'rgba(10,12,18,0.14)'; x.lineWidth = 1;
    x.beginPath(); x.moveTo(L, y); x.lineTo(L, y+96); x.stroke();
    x.fillStyle = C.blue;
    x.fillRect(L, y, 3, 96);
    x.fillStyle = C.ink;
    x.font = '700 27px "Bricolage Grotesque", sans-serif';
    wrap(x, p.quote, L + 30, y + 40, W - 30, 36);
    y += 132;
  }

  if (p.groups){
    for (var g=0; g<p.groups.length; g++){
      x.fillStyle = C.blue;
      x.font = '700 17px Inter, sans-serif';
      x.fillText(p.groups[g].k.toUpperCase(), L, y);
      y += 34;
      x.fillStyle = C.ink;
      x.font = '500 28px Inter, sans-serif';
      y = wrap(x, p.groups[g].v, L, y, W, 40) + 34;
    }
  }

  if (p.bullets){
    x.font = '500 27px Inter, sans-serif';
    for (var b=0;b<p.bullets.length;b++){
      x.fillStyle = C.blue;
      x.fillRect(L, y - 20, 16, 3);
      x.fillStyle = C.ink;
      y = wrap(x, p.bullets[b], L + 30, y, W - 30, 38) + 24;
    }
  }

  if (p.grid){
    var cols = 2, gap = 16;
    var iw = (W - gap) / cols;
    for (var s=0; s<p.items.length; s++){
      var col = s % cols, row = Math.floor(s/cols);
      var px = L + col*(iw+gap), py = y + row*82;
      x.strokeStyle = 'rgba(10,12,18,0.14)'; x.lineWidth = 1;
      rrect(x, px, py, iw, 66, 3); x.stroke();
      x.fillStyle = C.mist;
      x.font = '500 14px "JetBrains Mono", monospace';
      x.fillText('0' + (s+1), px + 16, py + 26);
      x.fillStyle = C.ink;
      x.font = '600 21px Inter, sans-serif';
      x.fillText(p.items[s], px + 16, py + 50);
    }
    y += Math.ceil(p.items.length/cols) * 82 + 30;
    if (p.note){
      x.fillStyle = C.mist;
      x.font = '500 22px Inter, sans-serif';
      x.fillText(p.note, L, y);
    }
    return c;
  }

  if (p.contact){
    for (var i2=0;i2<p.rows.length;i2++){
      x.fillStyle = C.mist;
      x.font = '700 15px "JetBrains Mono", monospace';
      x.fillText(p.rows[i2].k, L, y);
      x.strokeStyle = 'rgba(10,12,18,0.12)'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(L, y+14); x.lineTo(L+W, y+14); x.stroke();
      y += 46;
      x.fillStyle = C.ink;
      x.font = '600 33px Inter, sans-serif';
      x.fillText(p.rows[i2].v, L, y);
      y += 58;
    }
    return c;
  }

  if (p.big){
    x.fillStyle = C.blueDeep;
    x.font = '700 46px "Bricolage Grotesque", sans-serif';
    y = wrap(x, p.big, L, y, W, 54) + 8;
  }
  if (p.note){
    x.fillStyle = C.mist;
    x.font = '500 24px Inter, sans-serif';
    x.fillText(p.note, L, CH - M - 8);
  }
  return c;
}

function drawProject(p){
  var c = ctxNew(), x = c.getContext('2d');
  paperBase(x);
  var L = M + 40, W = CW - L - M;
  var y = header(x, p, L, W);

  y += 6;
  rrect(x, L, y, W, 210, 4);
  x.fillStyle = C.ink; x.fill();

  x.fillStyle = C.blue;
  x.font = '700 15px "JetBrains Mono", monospace';
  x.fillText('SM', L + 28, y + 46);

  x.fillStyle = C.white;
  x.font = '800 40px "Bricolage Grotesque", sans-serif';
  x.fillText('SmartMyBuy', L + 28, y + 96);

  x.fillStyle = 'rgba(255,255,255,0.55)';
  x.font = '500 21px Inter, sans-serif';
  wrap(x, p.body, L + 28, y + 138, W - 56, 30);

  y += 240;

  x.font = '600 18px Inter, sans-serif';
  var cx = L, cy = y;
  for (var i=0;i<p.pills.length;i++){
    var tw = x.measureText(p.pills[i]).width + 28;
    if (cx + tw > L + W){ cx = L; cy += 48; }
    rrect(x, cx, cy, tw, 38, 3);
    x.strokeStyle = 'rgba(10,12,18,0.16)'; x.lineWidth = 1; x.stroke();
    x.fillStyle = C.ink;
    x.fillText(p.pills[i], cx + 14, cy + 25);
    cx += tw + 10;
  }
  return c;
}

function drawCover(){
  var c = ctxNew(), x = c.getContext('2d');
  x.fillStyle = C.board; x.fillRect(0,0,CW,CH);
  var g = x.createLinearGradient(0,0,CW,CH);
  g.addColorStop(0,'rgba(46,94,255,0.22)');
  g.addColorStop(0.55,'rgba(10,12,18,0)');
  g.addColorStop(1,'rgba(46,94,255,0.10)');
  x.fillStyle = g; x.fillRect(0,0,CW,CH);
  x.globalAlpha = 0.04;
  for (var i=0;i<1400;i++){ x.fillStyle='#FFF'; x.fillRect(Math.random()*CW, Math.random()*CH, 1.4,1.4); }
  x.globalAlpha = 1;
  x.strokeStyle = 'rgba(46,94,255,0.4)'; x.lineWidth = 2;
  x.strokeRect(M*0.7, M*0.7, CW - M*1.4, CH - M*1.4);

  x.fillStyle = 'rgba(255,255,255,0.5)';
  x.font = '500 20px "JetBrains Mono", monospace';
  x.fillText('PORTFOLIO', M + 28, M + 110);

  x.fillStyle = C.white;
  x.font = '800 88px "Bricolage Grotesque", sans-serif';
  var y = wrap(x, 'Hekima Maulilio Sanga', M + 28, CH/2 - 60, CW - M*2 - 56, 92);

  x.fillStyle = C.blue;
  x.fillRect(M + 28, y + 14, 110, 5);

  x.fillStyle = 'rgba(255,255,255,0.62)';
  x.font = '500 29px Inter, sans-serif';
  x.fillText('Software Engineer', M + 28, y + 96);
  x.fillStyle = 'rgba(255,255,255,0.4)';
  x.font = '500 24px Inter, sans-serif';
  x.fillText('Laravel · Full-Stack', M + 28, y + 138);

  x.fillStyle = 'rgba(255,255,255,0.32)';
  x.font = '500 22px "JetBrains Mono", monospace';
  x.fillText('MOROGORO, TANZANIA', M + 28, CH - M - 8);
  return c;
}

function drawEnd(){
  var c = ctxNew(), x = c.getContext('2d');
  paperBase(x);
  var L = M + 40;
  x.fillStyle = C.ink;
  x.font = '800 56px "Bricolage Grotesque", sans-serif';
  wrap(x, 'Thanks for reading.', L, CH/2 - 30, CW - M*2, 66);
  x.fillStyle = C.blue;
  x.fillRect(L, CH/2 + 42, 90, 4);
  x.fillStyle = C.mist;
  x.font = '500 26px Inter, sans-serif';
  x.fillText('References available on request.', L, CH/2 + 110);
  return c;
}

function drawBack(){
  var c = ctxNew(), x = c.getContext('2d');
  x.fillStyle = C.board; x.fillRect(0,0,CW,CH);
  x.strokeStyle = 'rgba(46,94,255,0.22)'; x.lineWidth = 2;
  x.strokeRect(M*0.7, M*0.7, CW - M*1.4, CH - M*1.4);
  x.textAlign = 'center';
  x.fillStyle = 'rgba(46,94,255,0.8)';
  x.font = '700 40px "Bricolage Grotesque", sans-serif';
  x.fillText('HS', CW/2, CH/2 + 14);
  x.textAlign = 'left';
  return c;
}

/* =========================================================
   3.  THREE.JS
   ========================================================= */
var stage = document.getElementById('stage');
var intro = document.getElementById('intro');
var openBtn = document.getElementById('openBtn');
var loading = document.getElementById('loading');
var controls = document.getElementById('controls');
var hintEl = document.getElementById('hint');
var counter = document.getElementById('counter');
var prevBtn = document.getElementById('prev');
var nextBtn = document.getElementById('next');

if (!window.THREE){ loading.textContent = 'This page needs WebGL.'; return; }

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
camera.position.set(0, 1.2, 17);

var renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' }); }
catch(e){ loading.textContent = 'This page needs WebGL.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
stage.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.58));
var key = new THREE.DirectionalLight(0xeaf0ff, 1.15);
key.position.set(5, 9, 8); scene.add(key);
var fill = new THREE.DirectionalLight(0x2E5EFF, 0.55);
fill.position.set(-7, -2, 5); scene.add(fill);
var rim = new THREE.PointLight(0x2E5EFF, 1.1, 34);
rim.position.set(-3, 4, 7); scene.add(rim);

/* particles: cool blue, restrained */
var dustGeo = new THREE.BufferGeometry();
var dn = 220, dpos = new Float32Array(dn*3);
for (var d=0; d<dn; d++){
  dpos[d*3]   = (Math.random()-0.5)*34;
  dpos[d*3+1] = (Math.random()-0.5)*22;
  dpos[d*3+2] = (Math.random()-0.5)*18 - 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos,3));
var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color:0x2E5EFF, size:0.05, transparent:true, opacity:0.4, depthWrite:false
}));
scene.add(dust);

var book = new THREE.Group();
book.position.y = 0.2;
scene.add(book);

var PW = 5.2, PH = 7.3;

function tex(canvas){
  var t = new THREE.CanvasTexture(canvas);
  // Our canvases are 1000x1400 — not power-of-two. Three.js defaults to
  // mipmap trilinear filtering for CanvasTexture, which some WebGL1-only
  // mobile GPUs handle inconsistently on NPOT textures (pages silently
  // fail to render on some devices). Forcing plain linear filtering with
  // no mipmaps removes that ambiguity entirely, and is also cheaper.
  t.generateMipmaps = false;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.wrapS = THREE.ClampToEdgeWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.anisotropy = 1;
  t.needsUpdate = true;
  return t;
}

function makeUnit(frontCanvas, backCanvas, thick){
  var pivot = new THREE.Group();
  pivot.position.x = -PW/2;
  book.add(pivot);

  var segs = 26, meshes = [];

  function face(canvas, flip){
    var geo = new THREE.PlaneGeometry(PW, PH, segs, 1);
    geo.translate(PW/2, 0, 0);
    if (flip){
      var uv = geo.attributes.uv;
      for (var k=0; k<uv.count; k++) uv.setX(k, 1 - uv.getX(k));
      uv.needsUpdate = true;
    }
    var mat = new THREE.MeshStandardMaterial({
      map: tex(canvas),
      roughness: thick ? 0.55 : 0.86,
      metalness: thick ? 0.2 : 0.02,
      side: flip ? THREE.BackSide : THREE.FrontSide
    });
    var m = new THREE.Mesh(geo, mat);
    m.position.z = flip ? -(thick ? 0.07 : 0.008) : (thick ? 0.07 : 0.008);
    m.userData.base = geo.attributes.position.array.slice(0);
    pivot.add(m);
    meshes.push(m);
    return m;
  }

  face(frontCanvas, false);
  face(backCanvas, true);

  return { pivot:pivot, meshes:meshes, rot:0, target:0, thick:!!thick, dragging:false };
}

function bendUnit(u){
  var amt = Math.sin(u.rot) * (u.thick ? 0.10 : 0.95);
  for (var i=0;i<u.meshes.length;i++){
    var m = u.meshes[i];
    var pos = m.geometry.attributes.position;
    var base = m.userData.base;
    for (var v=0; v<pos.count; v++){
      var bx = base[v*3], by = base[v*3+1], bz = base[v*3+2];
      var t = bx / PW;
      var curl = Math.sin(t * Math.PI) * amt;
      var lift = Math.pow(t, 2.2) * amt * 0.30;
      pos.array[v*3]   = bx - curl * 0.16;
      pos.array[v*3+1] = by * (1 - curl * 0.012);
      pos.array[v*3+2] = bz + curl + lift;
    }
    pos.needsUpdate = true;
    m.geometry.computeVertexNormals();
  }
}

/* ---- build: 5 leaves = 10 readable faces + a fixed closing page ---- */
var units = [];
var canvases = {};

function buildBook(){
  canvases.cover     = drawCover();
  canvases.about      = drawPage(PAGES.about);
  canvases.summary    = drawPage(PAGES.summary);
  canvases.skills     = drawPage(PAGES.skills);
  canvases.expertise  = drawPage(PAGES.expertise);
  canvases.education  = drawPage(PAGES.education);
  canvases.project    = drawProject(PAGES.project);
  canvases.built      = drawPage(PAGES.built);
  canvases.strengths  = drawPage(PAGES.strengths);
  canvases.contact    = drawPage(PAGES.contact);
  canvases.end        = drawEnd();
  canvases.back       = drawBack();

  units.push(makeUnit(canvases.cover,    canvases.about,     true));
  units.push(makeUnit(canvases.summary,  canvases.skills,    false));
  units.push(makeUnit(canvases.expertise,canvases.education, false));
  units.push(makeUnit(canvases.project,  canvases.built,     false));
  units.push(makeUnit(canvases.strengths,canvases.contact,   false));

  var backPivot = new THREE.Group();
  backPivot.position.x = -PW/2;
  // Must sit behind every possible "unopened" depth an unflipped leaf can
  // reach (up to -STACK_STEP * units.length, computed in stackZ), or this
  // fixed end page bleeds through and covers pages that haven't been
  // reached yet. Comfortable margin beyond the worst case.
  backPivot.position.z = -0.9;
  var endGeo = new THREE.PlaneGeometry(PW, PH); endGeo.translate(PW/2, 0, 0);
  var endMesh = new THREE.Mesh(endGeo, new THREE.MeshStandardMaterial({ map:tex(canvases.end), roughness:0.9 }));
  endMesh.position.z = -0.10;
  var boardGeo = new THREE.PlaneGeometry(PW, PH); boardGeo.translate(PW/2, 0, 0);
  var boardMesh = new THREE.Mesh(boardGeo, new THREE.MeshStandardMaterial({ map:tex(canvases.back), roughness:0.5, metalness:0.25 }));
  boardMesh.rotation.y = Math.PI;
  boardMesh.position.z = -0.17;
  backPivot.add(endMesh, boardMesh);
  book.add(backPivot);

  var spine = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, PH + 0.12, 0.40),
    new THREE.MeshStandardMaterial({ color:0x0A0C12, roughness:0.5, metalness:0.3 })
  );
  spine.position.set(-PW/2 - 0.02, 0, -0.06);
  book.add(spine);
}

/* =========================================================
   4.  NAVIGATION  — one simple rule: unit i is flipped iff i < current
   ========================================================= */
var current = 0, MAXI;
var dragUnit = null, dragging = false, dragStartX = 0, moved = false, opened = false;

function stackZ(){
  // One fixed step for every leaf, on purpose: this is what guarantees a
  // later-index leaf always ends up physically closer to the camera than
  // an earlier one once both are flipped. The cover's own front/back face
  // gap (0.07 vs 0.008, set in face()) is a separate, purely cosmetic
  // "paper thickness" — it must never be allowed to influence this
  // cross-leaf ordering, or an earlier thick leaf can outrun a later
  // thin one and wrongly cover it (which is exactly what was happening).
  var STACK_STEP = 0.09;
  for (var i=0;i<units.length;i++){
    var u = units[i];
    var flipped = (i < current);
    var z = flipped ? STACK_STEP*(i+1) : -STACK_STEP*(i+1);
    u.pivot.position.z += (z - u.pivot.position.z) * 0.25;
  }
}

function goTo(n){
  current = Math.max(0, Math.min(MAXI, n));
  for (var i=0;i<units.length;i++) units[i].target = (i < current) ? Math.PI : 0;
  counter.innerHTML = '<b>' + String(current).padStart(2,'0') + '</b> / ' + String(MAXI).padStart(2,'0');
  prevBtn.disabled = (current === 0);
  nextBtn.disabled = (current === MAXI);
}
function next(){ if (current < MAXI) goTo(current+1); }
function prev(){ if (current > 0) goTo(current-1); }
nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);
window.addEventListener('keydown', function(e){
  if (!opened) return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

var el = renderer.domElement;
var pointer = { x:0, y:0 };

el.addEventListener('pointerdown', function(e){
  if (!opened) return;
  dragging = true; moved = false; dragStartX = e.clientX; dragUnit = null;
  try { el.setPointerCapture(e.pointerId); } catch(err){}
});
el.addEventListener('pointermove', function(e){
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
  if (!dragging) return;
  var dx = e.clientX - dragStartX;
  if (Math.abs(dx) > 4) moved = true;
  if (!dragUnit){
    if (dx < -6 && current < MAXI)      dragUnit = { u:units[current], dir:1 };
    else if (dx > 6 && current > 0)     dragUnit = { u:units[current-1], dir:-1 };
  }
  if (dragUnit){
    var span = Math.min(window.innerWidth * 0.5, 440);
    var p = Math.max(0, Math.min(1, Math.abs(dx) / span));
    dragUnit.u.target = dragUnit.dir === 1 ? p * Math.PI : Math.PI - p * Math.PI;
    dragUnit.u.dragging = true;
  }
});
function endDrag(){
  if (dragUnit){
    var u = dragUnit.u; u.dragging = false;
    var past = (dragUnit.dir === 1) ? (u.target > Math.PI*0.42) : (u.target < Math.PI*0.58);
    goTo(past ? (dragUnit.dir === 1 ? current+1 : current-1) : current);
    dragUnit = null;
  } else if (dragging && !moved && opened){
    if (dragStartX < window.innerWidth * 0.42) prev(); else next();
  }
  dragging = false;
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

/* =========================================================
   5.  CAMERA FIT — always frames the spread, any viewport
   ========================================================= */
var camTarget = { z:14, y:1.0 };
var bookTarget = { rx:-0.16, ry:0.30, x:0 };

function fitDistance(halfW, halfH){
  var vFov = camera.fov * Math.PI / 180;
  var dV = halfH / Math.tan(vFov/2);
  var dH = halfW / (Math.tan(vFov/2) * camera.aspect);
  return Math.max(dV, dH);
}

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  var isMobile = w <= 700;
  camera.fov = isMobile ? 34 : 26;
  camera.updateProjectionMatrix();

  var halfW = opened ? PW * (isMobile ? 0.95 : 1.08) : PW * 0.62;
  var halfH = PH * (isMobile ? 0.56 : 0.60);
  camTarget.z = fitDistance(halfW, halfH);
  camTarget.y = opened ? (isMobile ? 0.15 : 0.35) : 1.0;
  bookTarget.x = opened ? PW/2 : 0;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 180); });

function openBook(){
  if (opened) return;
  opened = true;
  intro.classList.add('gone');
  bookTarget.rx = -0.24;
  bookTarget.ry = 0.02;
  resize();
  setTimeout(function(){ goTo(1); }, 420);
  setTimeout(function(){ controls.classList.add('live'); hintEl.classList.add('live'); }, 950);
  setTimeout(function(){ hintEl.classList.remove('live'); }, 6000);
}
openBtn.addEventListener('click', openBook);

function lerp(a,b,t){ return a + (b-a)*t; }
var clock = new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);
  var t = clock.getElapsedTime();

  for (var i=0;i<units.length;i++){
    var u = units[i];
    var ease = u.dragging ? 0.34 : 0.085;
    u.rot = lerp(u.rot, u.target, ease);
    u.pivot.rotation.y = -u.rot;
    bendUnit(u);
  }
  stackZ();

  var wob = reduced ? 0 : Math.sin(t*0.4)*0.012;
  book.rotation.x = lerp(book.rotation.x, bookTarget.rx + (-pointer.y*0.05), 0.05);
  book.rotation.y = lerp(book.rotation.y, bookTarget.ry + (pointer.x*0.08) + wob, 0.05);
  book.position.x = lerp(book.position.x, bookTarget.x, 0.06);

  camera.position.z = lerp(camera.position.z, camTarget.z, 0.04);
  camera.position.y = lerp(camera.position.y, camTarget.y, 0.04);
  camera.lookAt(0, 0, 0);

  if (!reduced){ dust.rotation.y = t * 0.01; dust.position.y = Math.sin(t*0.2) * 0.3; }

  renderer.render(scene, camera);
}

function start(){
  try {
    buildBook();
    MAXI = units.length;
    resize();
    goTo(0);
    loop();
    loading.style.display = 'none';
    openBtn.style.display = 'inline-flex';
  } catch(err){
    loading.textContent = 'Something didn\'t load. Please refresh.';
    if (window.console) console.error(err);
  }
}

var FONT_LIST = [
  '700 1px "Bricolage Grotesque"', '800 1px "Bricolage Grotesque"',
  '500 1px Inter', '600 1px Inter', '700 1px Inter',
  '500 1px "JetBrains Mono"', '700 1px "JetBrains Mono"'
];

if (document.fonts && document.fonts.load){
  Promise.all(FONT_LIST.map(function(f){ return document.fonts.load(f); }))
    .then(function(){ return document.fonts.ready; })
    .then(start)
    .catch(start);
} else {
  setTimeout(start, 700);
}

})();
</script>
